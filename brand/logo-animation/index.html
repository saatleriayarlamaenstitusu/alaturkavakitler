<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Alaturka Vakitler — logo animasyonu</title>
<style>/* ──────────────────────────────────────────────────────────────
   Alaturka Vakitler — logo reveal

   Koreografi:
   1. İşaret ORTADA parça parça belirir.
   2. İşaret sola kayarak yerine oturur.
   3. Kayarken sağda harfler soldan sağa tek tek açılır; her harf hafifçe
      sağdan gelir, yani işaret onları çekiştiriyormuş gibi geriden yetişir.

   Harfler gerçekten ayrı yollar: kelime yolundaki alt yollar mutlak
   koordinata çevrilip x konumlarına göre harflere gruplandı (8 + 8).
   ────────────────────────────────────────────────────────────── */
:root {
  --ink: #ffffff;
  --paper: #0b0b0c;
  --dur: 1;           /* hız çarpanı: 1 = ~2.4 sn */
  --size: 520px;
  /* Faz 1'de işareti tuvalin ortasına getiren kaydırma (viewBox birimi). */
  --shift: 19.814;
  /* Harfler arası gecikme ve her harfin süresi. */
  --ltr-step: 0.052s;
  --ltr-dur: 0.42s;
}

.mark {
  width: 100%;
  height: auto;
  overflow: visible;
  fill: currentColor;
}

/* Tüm kilit: önce sağa kaymış durur (işaret ortada), sonra yerine kayar. */
.lockup {
  transform: translateX(calc(var(--shift) * 1px));
  animation: slide calc(0.72s * var(--dur)) cubic-bezier(.26,.86,.3,1) calc(0.58s * var(--dur)) forwards;
}

@keyframes slide {
  to { transform: translateX(0); }
}

/* İşaret parçaları ortada belirir. `transform-box: fill-box` olmadan SVG'de
   dönüşüm kökeni tuvalin tamamına göre hesaplanır ve parçalar uçar. */
.piece {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  opacity: 0;
  animation: piece-in calc(0.56s * var(--dur)) cubic-bezier(.2,.9,.26,1) forwards;
}

.p2 { animation-delay: calc(0.02s * var(--dur)); }
.p1 { animation-delay: calc(0.14s * var(--dur)); }

@keyframes piece-in {
  from { opacity: 0; transform: translateY(26%) scale(.82); }
  to   { opacity: 1; transform: none; }
}

/* Harfler: soldan sağa sırayla. Her harf kendi genişliğinin bir miktar
   sağından gelir — işaret sola giderken onları çekiyormuş hissi bundan. */
.ltr {
  transform-box: fill-box;
  transform-origin: 50% 50%;
  opacity: 0;
  animation:
    ltr-in calc(var(--ltr-dur) * var(--dur)) cubic-bezier(.18,.78,.26,1) forwards;
  animation-delay: calc((0.66s + var(--i) * var(--ltr-step)) * var(--dur));
}

/* Alt satır üst satırın bir tık gerisinden gelir; iki satır aynı anda
   açılınca hareket düz bir duvar gibi okunuyordu. */
.ltr.v { animation-delay: calc((0.72s + var(--i) * var(--ltr-step)) * var(--dur)); }

@keyframes ltr-in {
  from { opacity: 0; transform: translateX(2.2px) scale(.96); }
  to   { opacity: 1; transform: none; }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--paper);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

body.transparent { background: transparent; }

/* Kayıt alanı: bu kutu olduğu gibi videoya alınır. */
.stage { position: fixed; inset: 0; display: grid; place-items: center; }

.logo { width: var(--size); color: var(--ink); line-height: 0; }

/* ── Çıkış (outro) ── */
.logo.out .lockup { animation: none; transform: translateX(0); }

.logo.out .piece,
.logo.out .ltr {
  animation: fade-out calc(0.4s * var(--dur)) ease-in forwards;
  animation-delay: 0s;
}

.logo.out .ltr { animation-delay: calc((7 - var(--i)) * 0.022s * var(--dur)); }
.logo.out .p1 { animation-delay: calc(0.2s * var(--dur)); }
.logo.out .p2 { animation-delay: calc(0.24s * var(--dur)); }

@keyframes fade-out {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translateX(-3px) scale(.96); }
}

@media (prefers-reduced-motion: reduce) {
  .piece, .ltr { animation-duration: .01ms !important; animation-delay: 0s !important; }
  .lockup { animation-duration: .01ms !important; animation-delay: 0s !important; }
}

/* ── Denetimler (yalnızca önizleme; kayıtta ?chrome=0 ile gizlenir) ── */
.panel {
  position: fixed;
  left: 50%;
  bottom: 1.25rem;
  transform: translateX(-50%);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: .75rem;
  padding: .7rem 1rem;
  border: 1px solid rgba(128,128,128,.35);
  border-radius: 10px;
  background: rgba(20,20,22,.82);
  backdrop-filter: blur(8px);
  color: #e8e8e8;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.panel.hidden { display: none; }
.panel button, .panel select {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: #e8e8e8;
  background: transparent;
  border: 1px solid rgba(128,128,128,.45);
  border-radius: 6px;
  padding: .32rem .6rem;
  cursor: pointer;
}
.panel button:hover { border-color: #e8e8e8; }
.panel label { display: flex; align-items: center; gap: .4rem; }
.panel input[type=range] { width: 92px; }
.swatches { display: flex; gap: .35rem; }
.sw {
  width: 20px; height: 20px; padding: 0;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
  cursor: pointer;
}
.sw.active { outline: 2px solid #e8e8e8; outline-offset: 2px; }
</style>
</head>
<body>

<div class="stage">

        </g>
      </g>
    </svg>
  </div>
</div>
</div>

<div class="panel" id="panel">
  <button id="play">Yeniden oynat</button>
  <button id="outro">Çıkış</button>
  <label>Hız <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1"></label>
  <label>Boy <input type="range" id="size" min="200" max="900" step="20" value="520"></label>
  <span class="swatches" id="bgs"></span>
  <label><input type="checkbox" id="loop"> Döngü</label>
</div>

<script>
// Vakit renkleri: tanıtım videosunda hangi vakte denk geliyorsa o renk.
const BG = [
  ['Koyu',    '#0b0b0c', '#ffffff'],
  ['Kağıt',   '#edebe5', '#111111'],
  ['İmsak',   '#00284a', '#ffffff'],
  ['Öğle',    '#ffd733', '#111111'],
  ['İkindi',  '#ff8c33', '#111111'],
  ['Yatsı',   '#2e3b83', '#ffffff'],
  ['Saydam',  'transparent', '#ffffff'],
];

const qs = new URLSearchParams(location.search);
const logo = document.getElementById('logo');
const panel = document.getElementById('panel');
const root = document.documentElement;

function setBg(i) {
  const [, paper, ink] = BG[i];
  root.style.setProperty('--paper', paper === 'transparent' ? 'transparent' : paper);
  root.style.setProperty('--ink', ink);
  document.body.classList.toggle('transparent', paper === 'transparent');
  [...document.querySelectorAll('.sw')].forEach((b, n) => b.classList.toggle('active', n === i));
}

const bgs = document.getElementById('bgs');
BG.forEach(([name, paper], i) => {
  const b = document.createElement('button');
  b.className = 'sw';
  b.title = name;
  b.style.background = paper === 'transparent'
    ? 'repeating-conic-gradient(#999 0% 25%, #ccc 0% 50%) 50%/8px 8px'
    : paper;
  b.onclick = () => setBg(i);
  bgs.appendChild(b);
});

// Animasyonu baştan oynatmak için düğümleri yeniden kurmak gerekiyor:
// CSS animasyonu aynı elemanda kendiliğinden yeniden başlamıyor.
function play(out = false) {
  logo.classList.remove('out');
  const clone = logo.cloneNode(true);
  logo.replaceWith(clone);
  bind(clone);
  if (out) requestAnimationFrame(() => clone.classList.add('out'));
  window.__logo = clone;
  window.__done = false;
  const total = out ? 900 : 2200;
  setTimeout(() => { window.__done = true; }, total / (parseFloat(root.style.getPropertyValue('--dur')) || 1));
}

function bind(el) { el.id = 'logo'; }

document.getElementById('play').onclick = () => play(false);
document.getElementById('outro').onclick = () => play(true);
document.getElementById('speed').oninput = (e) => root.style.setProperty('--dur', e.target.value);
document.getElementById('size').oninput = (e) => root.style.setProperty('--size', e.target.value + 'px');
document.getElementById('loop').onchange = (e) => {
  clearInterval(window.__loop);
  if (e.target.checked) window.__loop = setInterval(() => play(false), 3000);
};

// Kayıt modu: ?chrome=0 denetimleri gizler, ?bg=6 saydam zemin verir,
// ?size=720 ve ?dur=1 ölçü ve hızı sabitler. render.mjs bunları kullanır.
if (qs.get('chrome') === '0') panel.classList.add('hidden');
setBg(Number(qs.get('bg') ?? 0));
if (qs.get('size')) root.style.setProperty('--size', qs.get('size') + 'px');
root.style.setProperty('--dur', qs.get('dur') ?? '1');
if (qs.get('autoplay') !== '0') play(qs.get('mode') === 'outro');
</script>
</body>
</html>
